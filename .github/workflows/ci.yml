name: PR API compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_PORT: "8081"
  HEAD_PORT: "8082"
  ENGINE_PORT: "8080"
  # owner/repo of the api-compatibility engine, provided as a repository
  # variable so that no repository URL is hard-coded in this workflow.
  COMPATIBILITY_REPOSITORY: ${{ vars.COMPATIBILITY_REPOSITORY }}
  COMPATIBILITY_REF: ${{ vars.COMPATIBILITY_REF || 'main' }}

jobs:
  compatibility-gate:
    name: Compare the generated contract with main
    runs-on: ubuntu-latest
    steps:
      - name: Check that the compatibility repository is configured
        run: |
          if [ -z "${COMPATIBILITY_REPOSITORY}" ]; then
            echo "::error::Repository variable COMPATIBILITY_REPOSITORY is not set. Point it at the api-compatibility repository (owner/repo)."
            exit 1
          fi
          echo "compatibility engine: ${COMPATIBILITY_REPOSITORY}@${COMPATIBILITY_REF}"

      # The pull request revision. A second checkout later adds the compatibility
      # engine under ./engine because it lives in its own repository.
      - name: Check out the demo API at the pull request revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve the base (main) and head revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Both SHAs are present for pull_request events; the explicit fetches
          # keep fork pull requests working the same way.
          git fetch --no-tags origin "${BASE_SHA}" || true
          git fetch --no-tags origin "${HEAD_SHA}" || true
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head" || true

          for sha in "${BASE_SHA}" "${HEAD_SHA}"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::revision ${sha} is not available in this checkout"
              exit 1
            fi
          done

          echo "baseline (main): ${BASE_SHA}"
          echo "candidate (pr) : ${HEAD_SHA}"

          {
            echo "BASE_SHA=${BASE_SHA}"
            echo "HEAD_SHA=${HEAD_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Export the base and head source trees
        run: |
          set -euo pipefail

          for pair in "base:${BASE_SHA}" "head:${HEAD_SHA}"; do
            name="${pair%%:*}"
            sha="${pair#*:}"
            target="${RUNNER_TEMP}/${name}"

            rm -rf "${target}"
            mkdir -p "${target}"
            git archive --format=tar "${sha}" | tar -x -C "${target}"
            chmod +x "${target}/mvnw"
          done

      - name: Build the base and head demo APIs
        run: |
          set -euo pipefail

          for name in base head; do
            echo "::group::maven build (${name})"
            ( cd "${RUNNER_TEMP}/${name}" && ./mvnw -B -ntp clean package )
            echo "::endgroup::"
          done

      - name: Start the base and head demo APIs
        run: |
          set -euo pipefail

          start_api() {
            local name="$1"
            local port="$2"
            local directory="${RUNNER_TEMP}/${name}"
            local jar

            jar="$(find "${directory}/target" -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
            if [ -z "${jar}" ]; then
              echo "::error::no runnable jar was produced for the ${name} API"
              return 1
            fi

            nohup java -jar "${jar}" --server.port="${port}" > "${RUNNER_TEMP}/${name}.log" 2>&1 &
            echo "$!" > "${RUNNER_TEMP}/${name}.pid"
            echo "started the ${name} API on port ${port} (pid $!)"
          }

          start_api base "${BASE_PORT}"
          start_api head "${HEAD_PORT}"

      - name: Fetch both generated OpenAPI documents
        run: |
          set -euo pipefail

          wait_for_docs() {
            local name="$1"
            local port="$2"
            local output="$3"

            for _ in $(seq 1 60); do
              if curl -fsS "http://localhost:${port}/v3/api-docs" -o "${output}" && [ -s "${output}" ]; then
                echo "${name} specification collected from port ${port}"
                return 0
              fi
              sleep 2
            done

            echo "::error::the ${name} API never served /v3/api-docs on port ${port}"
            return 1
          }

          wait_for_docs base "${BASE_PORT}" "${RUNNER_TEMP}/baseline.json"
          wait_for_docs head "${HEAD_PORT}" "${RUNNER_TEMP}/new.json"

          jq -e . "${RUNNER_TEMP}/baseline.json" > /dev/null
          jq -e . "${RUNNER_TEMP}/new.json" > /dev/null

      - name: Check out the compatibility engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.COMPATIBILITY_REPOSITORY }}
          ref: ${{ env.COMPATIBILITY_REF }}
          token: ${{ secrets.COMPATIBILITY_TOKEN || github.token }}
          path: engine

      - name: Build and start the compatibility engine
        run: |
          set -euo pipefail

          cd engine
          ./mvnw -B -ntp package

          jar="$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)"
          if [ -z "${jar}" ]; then
            echo "::error::no runnable jar was produced for the compatibility engine"
            exit 1
          fi

          nohup java -jar "${jar}" --server.port="${ENGINE_PORT}" > "${RUNNER_TEMP}/engine.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/engine.pid"
          echo "started the compatibility engine on port ${ENGINE_PORT} (pid $!)"

          for _ in $(seq 1 60); do
            if curl -fsS "http://localhost:${ENGINE_PORT}/api/health" > /dev/null; then
              echo "the compatibility engine is ready"
              exit 0
            fi
            sleep 2
          done

          echo "::error::the compatibility engine never answered on /api/health"
          exit 1

      - name: Compare the baseline against the pull request contract
        id: compare
        run: |
          set -euo pipefail

          jq -n \
            --rawfile old "${RUNNER_TEMP}/baseline.json" \
            --rawfile new "${RUNNER_TEMP}/new.json" \
            '{oldDocument: $old, newDocument: $new}' > "${RUNNER_TEMP}/compare-request.json"

          status="$(curl -sS -o "${RUNNER_TEMP}/report.json" -w '%{http_code}' \
            -X POST "http://localhost:${ENGINE_PORT}/api/compare/report?failOnBreaking=true" \
            -H 'Content-Type: application/json' \
            --data-binary "@${RUNNER_TEMP}/compare-request.json")" || {
              echo "::error::could not reach the compatibility engine on port ${ENGINE_PORT}"
              exit 1
            }

          echo "status=${status}" >> "${GITHUB_OUTPUT}"

          echo "HTTP status from the compatibility engine: ${status}"
          echo
          echo "====================== compatibility report ======================"
          jq . "${RUNNER_TEMP}/report.json" 2>/dev/null || cat "${RUNNER_TEMP}/report.json"
          echo "=================================================================="

          case "${status}" in
            200)
              echo "no breaking changes detected"
              ;;
            409)
              echo "breaking changes detected"
              ;;
            *)
              echo "::error::unexpected HTTP ${status} from /api/compare/report. Check that ${COMPATIBILITY_REPOSITORY}@${COMPATIBILITY_REF} exposes the compatibility API."
              exit 1
              ;;
          esac

          # Surface the report on the run's Summary page so reviewers do not
          # have to dig through the logs to see what the gate found.
          {
            echo "## API compatibility report"
            echo
            case "${status}" in
              200)
                echo "✅ **No breaking changes detected** between \`main\` and this pull request."
                ;;
              409)
                echo "❌ **Breaking API changes detected** between \`main\` and this pull request."
                ;;
            esac
            echo
            echo "| Revision | Commit |"
            echo "| --- | --- |"
            echo "| baseline (\`main\`) | \`${BASE_SHA}\` |"
            echo "| candidate (PR) | \`${HEAD_SHA}\` |"
            echo
            # When the engine reports a breakingChanges array, render it as a
            # table first; the full JSON report follows either way.
            if jq -e '.breakingChanges? | type == "array" and length > 0' \
                "${RUNNER_TEMP}/report.json" > /dev/null 2>&1; then
              echo "### Breaking changes"
              echo
              echo "| # | Change |"
              echo "| --- | --- |"
              jq -r '.breakingChanges | to_entries[] | "| \(.key + 1) | \(.value | tostring | gsub("\\|"; "\\\\|") | gsub("\n"; " ")) |"' \
                "${RUNNER_TEMP}/report.json"
              echo
            fi
            echo "<details>"
            echo "<summary>Full report (JSON)</summary>"
            echo
            echo '```json'
            jq . "${RUNNER_TEMP}/report.json" 2>/dev/null || cat "${RUNNER_TEMP}/report.json"
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail the gate when the contract is broken
        if: steps.compare.outputs.status == '409'
        run: |
          echo "::error::Breaking API changes were detected between main and this pull request. The pull request cannot be merged as-is."
          exit 1

      - name: Show the server logs
        if: failure()
        run: |
          for name in base head engine; do
            if [ -f "${RUNNER_TEMP}/${name}.log" ]; then
              echo "::group::${name}.log"
              tail -n 200 "${RUNNER_TEMP}/${name}.log"
              echo "::endgroup::"
            fi
          done

      - name: Stop the demo APIs and the compatibility engine
        if: always()
        run: |
          for name in base head engine; do
            pid_file="${RUNNER_TEMP}/${name}.pid"
            if [ ! -f "${pid_file}" ]; then
              continue
            fi

            pid="$(cat "${pid_file}")"
            if kill -0 "${pid}" 2>/dev/null; then
              echo "stopping the ${name} process (pid ${pid})"
              kill "${pid}" 2>/dev/null || true
              for _ in $(seq 1 15); do
                kill -0 "${pid}" 2>/dev/null || break
                sleep 1
              done
              kill -9 "${pid}" 2>/dev/null || true
            fi

            rm -f "${pid_file}"
          done
